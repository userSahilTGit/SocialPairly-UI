# SocialPairly UI + API on EC2 (IP and/or domain).
# Place SPA build in /var/www/socialpairly (npm run build → dist/*).
# Backend listen port must match BACKEND_PORT in src/config/ports.js
# and app.server.port in the workflow-manager ports.properties.
# Backend listens on 127.0.0.1:9010.
#
# GCP OAuth Authorized JavaScript origins (exact):
#   http://3.151.77.90
#   http://3.151.77.90.nip.io
#   https://www.socialpairly.com
#   https://socialpairly.com
# Redirect URIs: same hosts with /signin

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 3.151.77.90 3.151.77.90.nip.io www.socialpairly.com socialpairly.com;

    root /var/www/socialpairly;
    index index.html;

    # Google Identity Services postMessage handshake
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → Spring Boot (same-origin /api so axios baseURL works)
    location /api/ {
        proxy_pass http://127.0.0.1:9010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cookie_path / /;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:9010/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
